name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    env:
      # NEXT_PUBLIC_* values are inlined into the client bundle at build time.
      # A Worker binding of the same name in wrangler.toml is invisible to the
      # browser, so the build must be given a real backend URL or the deployed
      # /agent page silently falls back to http://localhost:8051.
      NEXT_PUBLIC_BACKEND_URL: https://gmruxxvvxbypxv4d74kix7l6aq0ppwmd.lambda-url.us-east-1.on.aws
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Run Tests
        working-directory: ./frontend
        run: npm test

      - name: Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Application
        working-directory: ./frontend
        run: npm run build

      - name: Build Cloudflare Worker Bundle
        working-directory: ./frontend
        run: npm run build:cloudflare

      - name: Verify Backend URL Is Inlined In Bundle
        working-directory: ./frontend
        run: npm run verify:cloudflare

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          python backend/init_db.py
          python backend/seed_db.py

      - name: Start Headless Chrome
        run: |
          google-chrome-stable --headless --disable-gpu --no-sandbox --user-data-dir=/tmp/chrome-data --remote-debugging-port=9222 &
          sleep 3

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          BROWSER_WS_ENDPOINT: ws://localhost:9222
          GROQ_API_KEY: dummy-groq-key
        run: |
          python -m pytest backend/tests/

